<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Millennial's Guide to the Aftermath</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #5B534B;
    color: #F4F1EA;
    font-family: Futura, "Century Gothic", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    line-height: 1.55;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 20px 56px; }
  .cover {
    margin: -32px -20px 0;
    padding: 44px 24px 38px;
    text-align: center;
    background: #655C52;
  }
  .logo { display: block; width: 100%; max-width: 380px; height: auto; margin: 0 auto; }
  .geo { display: block; width: 300px; max-width: 90%; height: auto; margin: 26px auto 4px; }
  .dont-panic {
    margin: 12px 0 6px;
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #F4F1EA;
  }
  .redrule { width: 64px; height: 6px; background: #E3A82F; margin: 14px auto; }
  .series { margin: 0; font-size: 25px; font-weight: 600; color: #F4F1EA; }
  .sub {
    margin: 8px 0 0;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #CFC8BA;
  }
  h2 {
    margin: 40px 0 12px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-bottom: 3px solid #E3A82F;
    padding-bottom: 8px;
  }
  .letter {
    margin: 26px 0 8px;
    font-size: 28px;
    font-weight: 700;
    color: #E3A82F;
  }
  a.book {
    display: block;
    padding: 18px;
    border: 3px solid #F4F1EA;
    border-radius: 6px;
    background: #6B6259;
    color: #F4F1EA;
    text-decoration: none;
  }
  a.book strong { display: block; font-size: 20px; font-weight: 600; }
  a.book span { color: #CFC8BA; font-size: 15px; }
  .pdf { margin-top: 12px; font-size: 15px; }
  .pdf a { color: #E8B33C; }
  footer {
    margin-top: 44px;
    text-align: center;
    color: #CFC8BA;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    margin-top: 36px;
  }
  .tile {
    display: block;
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 5px;
    text-decoration: none;
  }
  .tile::before { content: ""; display: block; padding-top: 100%; }
  .tile svg { display: block; position: absolute; left: 22%; top: 22%; width: 56%; height: 56%; }
</style>
</head>
